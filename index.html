<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>贪吃蛇大作战</title>
  <link rel="icon" href="BBB.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud hud-score" aria-hidden="true">
    <div class="hud-row">
      <span class="hud-label">得分</span>
      <strong id="scoreValue">0</strong>
    </div>
    <div class="hud-row">
      <span class="hud-label">长度</span>
      <strong id="lengthValue">36</strong>
    </div>
    <div class="hud-row">
      <span class="hud-label">排名</span>
      <strong id="rankValue">-</strong>
    </div>
  </div>

  <div class="hud hud-board" aria-hidden="true">
    <div class="board-title">排行榜</div>
    <ol id="leaderboard"></ol>
  </div>

  <div class="hud hud-boost" aria-hidden="true">
    <div class="boost-track"><div id="boostFill"></div></div>
  </div>

  <div class="hud hud-map" aria-hidden="true">
    <canvas id="minimap" width="168" height="126"></canvas>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="panel">
      <h1>贪吃蛇大作战</h1>
      <label class="field">
        <span>名字</span>
        <input id="nameInput" maxlength="12" value="果冻蛇">
      </label>
      <div class="skin-picker">
        <span class="field-label">蛇头</span>
        <div class="skin-preview">
          <img src="BBB.png" alt="">
        </div>
      </div>
      <button class="primary" id="startBtn" type="button">开始游戏</button>
    </div>
  </div>

  <div class="overlay hidden" id="deathOverlay">
    <div class="panel">
      <h1>游戏结束</h1>
      <div class="final-score">
        <span>最终得分</span>
        <strong id="finalScore">0</strong>
      </div>
      <button class="primary" id="restartBtn" type="button">再来一局</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
